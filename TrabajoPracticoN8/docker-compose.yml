services:
  postgres-primary:
    image: postgres:15-alpine
    container_name: postgres-primary
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: distribuidos_db
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256 --auth-local=scram-sha-256"
      POSTGRES_HOST_AUTH_METHOD: md5
    ports:
      - "5432:5432"
    volumes:
      - pg_primary_data:/var/lib/postgresql/data
      - ./db:/docker-entrypoint-initdb.d
    command: >
      postgres 
      -c listen_addresses='*' 
      -c wal_level=replica 
      -c max_wal_senders=10 
      -c max_replication_slots=10 
      -c hot_standby=on

  postgres-replica:
    image: postgres:15-alpine
    container_name: postgres-replica
    environment:
      PGUSER: postgres
      PGPASSWORD: password123
    ports:
      - "5433:5432"
    volumes:
      - pg_replica_data:/var/lib/postgresql/data
    depends_on:
      - postgres-primary
    command: |
      bash -c "
      until pg_isready -h postgres-primary -p 5432 -U postgres; do
        echo 'Esperando al nodo primario...'
        sleep 2
      done
      
      echo 'Iniciando respaldo pg_basebackup...'
      rm -rf /var/lib/postgresql/data/*
      PGPASSWORD=password123 pg_basebackup -h postgres-primary -p 5432 -U postgres -D /var/lib/postgresql/data -Fp -Xs -R
      
      chown -R postgres:postgres /var/lib/postgresql/data
      chmod 700 /var/lib/postgresql/data
      
      exec su-exec postgres postgres -c hot_standby=on
      "

volumes:
  pg_primary_data:
  pg_replica_data: